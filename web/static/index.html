<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>BEAST</title>
<link rel="manifest" href="/static/manifest.json">
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --dim: #8b949e;
  --accent: #f778ba;
  --accent2: #d2a8ff;
  --green: #3fb950;
  --orange: #ff7b72;
  --cyan: #79c0ff;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.mono { font-family: 'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace; }

#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }

/* ═══ HEADER (minimal) ═══ */
#header {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; background:var(--bg2); border-bottom:1px solid var(--border);
  flex-shrink:0; min-height:48px;
}
#logo { font-size:16px; font-weight:800; letter-spacing:-0.5px; }
#logo .a { color:var(--accent); }
#logo .b { color:var(--text); }
#mode-btn {
  display:flex; align-items:center; gap:5px;
  font-size:12px; color:var(--text); background:var(--bg3);
  border:1px solid var(--border); padding:5px 10px; border-radius:16px; cursor:pointer;
}
#mode-btn:active { border-color:var(--accent); }
#spacer { flex:1; }
#conn { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); }
#conn .dot { width:8px; height:8px; border-radius:50%; background:var(--yellow); }
#conn .dot.on { background:var(--green); box-shadow:0 0 6px var(--green); }

/* ═══ QUICK CHIPS ═══ */
#chips {
  display:flex; gap:7px; padding:9px 12px; overflow-x:auto;
  background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
#chips::-webkit-scrollbar { display:none; }
.chip {
  background:var(--bg3); border:1px solid var(--border); color:var(--text);
  padding:7px 13px; border-radius:16px; font-size:13px; white-space:nowrap;
  cursor:pointer; flex-shrink:0; touch-action:manipulation;
}
.chip:active { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.chip.green { border-color:#3fb95055; color:var(--green); }
.chip.pink { border-color:#f778ba55; color:var(--accent); }
.chip.cyan { border-color:#79c0ff55; color:var(--cyan); }

/* ═══ OUTPUT (chat-style) ═══ */
#output {
  flex:1; overflow-y:auto; padding:12px 14px;
  -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:6px;
}
.msg { font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.msg.cmd { color:var(--cyan); font-family:'SF Mono',Consolas,monospace; font-size:12.5px; }
.msg.cmd::before { content:'❯ '; color:var(--dim); }
.msg.out { color:var(--text); font-family:'SF Mono',Consolas,monospace; font-size:12.5px; opacity:.92; }
.msg.sys { color:var(--dim); font-size:12px; font-style:italic; }
.msg.err { color:var(--orange); }
.msg.ai { color:var(--text); }
.divider { border-top:1px solid var(--border); margin:4px 0; }
#empty {
  color:var(--dim); text-align:center; font-size:14px;
  padding:40px 10px; margin:auto;
}
#empty .hint { font-size:12px; margin-top:10px; opacity:.7; }

/* ═══ INPUT BAR (bottom, thumb-friendly) ═══ */
#inputbar {
  display:flex; gap:8px; padding:9px 12px;
  background:var(--bg2); border-top:1px solid var(--border); flex-shrink:0;
  padding-bottom:max(9px, env(safe-area-inset-bottom));
}
#input {
  flex:1; background:var(--bg3); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:20px; font-size:15px; outline:none;
  font-family:'SF Mono',Consolas,monospace; resize:none;
}
#input:focus { border-color:var(--accent); }
#send {
  background:var(--accent); color:var(--bg); border:none;
  padding:0 20px; border-radius:20px; font-size:15px; font-weight:700;
  cursor:pointer; flex-shrink:0; touch-action:manipulation;
}
#send:active { transform:scale(.95); }
#send:disabled { background:var(--bg3); color:var(--dim); }
#keyrow { display:flex; gap:5px; padding:0 12px 8px; background:var(--bg2); flex-shrink:0; flex-wrap:wrap; }
#keyrow button {
  flex:1; min-width:44px; background:var(--bg3); border:1px solid var(--border);
  color:var(--text); padding:8px 0; border-radius:8px; font-size:12px; cursor:pointer;
  font-family:'SF Mono',Consolas,monospace; touch-action:manipulation;
}
#keyrow button:active { background:var(--accent); color:var(--bg); }
#keyrow button.danger { color:var(--orange); }

/* desktop: hide keyrow, bigger max width */
@media (min-width:768px) {
  #keyrow { display:none; }
  #output { max-width:900px; width:100%; margin:0 auto; }
  #inputbar { max-width:900px; width:100%; margin:0 auto; }
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div id="logo"><span class="a">🔥</span><span class="b">BEAST</span></div>
    <button id="mode-btn" onclick="cycleMode()"><span id="mode-ico">🔥</span><span id="mode-nm">Pentest</span></button>
    <div id="spacer"></div>
    <div id="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">…</span></div>
  </div>

  <!-- QUICK CHIPS -->
  <div id="chips">
    <button class="chip pink" onclick="quick('/recon ')">🔍 Recon</button>
    <button class="chip pink" onclick="quick('/cve ')">🎯 CVE</button>
    <button class="chip pink" onclick="quick('/chains ')">⛓️ Exploit</button>
    <button class="chip green" onclick="quick('/git ')">💻 Git</button>
    <button class="chip green" onclick="quick('/review ')">📝 Review</button>
    <button class="chip cyan" onclick="quick('/search ')">📚 Skill</button>
    <button class="chip cyan" onclick="quick('/parallel ')">⚡ Parallel</button>
    <button class="chip" onclick="quick('/help')">❓ Help</button>
  </div>

  <!-- OUTPUT -->
  <div id="output">
    <div id="empty">
      <div style="font-size:40px">🔥</div>
      <div style="margin-top:8px">BEAST Terminal</div>
      <div class="hint">Ketik command di bawah, atau tap chip di atas<br>Works di HP & PC</div>
    </div>
  </div>

  <!-- KEY ROW (mobile) -->
  <div id="keyrow">
    <button onclick="sendKey('Tab')">Tab</button>
    <button onclick="sendKey('Escape')">Esc</button>
    <button class="danger" onclick="sendKey('CtrlC')">^C</button>
    <button class="danger" onclick="sendKey('CtrlD')">^D</button>
    <button onclick="sendKey('ArrowUp')">↑</button>
    <button onclick="sendKey('ArrowDown')">↓</button>
  </div>

  <!-- INPUT BAR -->
  <div id="inputbar">
    <input id="input" type="text" placeholder="Ketik command…" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="send">
    <button id="send" onclick="sendInput()">Kirim ➤</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.4/dist/socket.io.min.js"></script>
<script>
// ═══ STATE ═══
let currentMode = localStorage.getItem('beast_mode') || 'pentest';
let sessionId = localStorage.getItem('beast_session') || '';
const MODES = {
  pentest: { ico:'🔥', nm:'Pentest', color:'#f778ba' },
  coding:  { ico:'💻', nm:'Coding',  color:'#79c0ff' },
  general: { ico:'🧠', nm:'General', color:'#d2a8ff' },
};
const KEYMAP = { 'Enter':'\r','Tab':'\t','Escape':'\x1b','ArrowUp':'\x1b[A','ArrowDown':'\x1b[B','CtrlC':'\x03','CtrlD':'\x04' };

// ═══ SOCKET ═══
const socket = io({ query:{session_id:sessionId, mode:currentMode}, transports:['websocket','polling'], reconnection:true });
const output = document.getElementById('output');
const empty = document.getElementById('empty');

socket.on('connect', () => setConn(true));
socket.on('disconnect', () => setConn(false));
socket.on('connected', (d) => { sessionId=d.session_id; localStorage.setItem('beast_session',sessionId); });
socket.on('output', (d) => { if (d.data) render(d.data); });

// ═══ RENDER (strip ANSI, clean text) ═══
let lastMsgEl = null;
function render(raw) {
  if (empty) empty.remove();
  // strip ANSI + box-drawing noise
  let clean = raw
    .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
    .replace(/[\u2500-\u257f\u2580-\u259f]/g, '')
    .replace(/\r/g, '');
  // split into lines, drop empty box lines
  const lines = clean.split('\n').filter(l => l.trim().length > 0);
  // simple classification
  const div = document.createElement('div');
  div.className = 'msg out';
  div.textContent = lines.join('\n');
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

// ═══ INPUT ═══
function sendInput() {
  const inp = document.getElementById('input');
  const txt = inp.value;
  if (!txt.trim()) return;
  socket.emit('input', { session_id:sessionId, text: txt + '\r' });
  addCmdLine(txt);
  inp.value = '';
  inp.focus();
}
function addCmdLine(txt) {
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg cmd'; d.textContent = txt;
  output.appendChild(d); output.scrollTop = output.scrollHeight;
}
function quick(cmd) {
  const inp = document.getElementById('input');
  inp.value = cmd; inp.focus();
}
function sendKey(k) {
  socket.emit('input', { session_id:sessionId, text: KEYMAP[k]||k });
}
function cycleMode() {
  const order = ['pentest','coding','general'];
  currentMode = order[(order.indexOf(currentMode)+1)%order.length];
  localStorage.setItem('beast_mode', currentMode);
  const m = MODES[currentMode];
  document.getElementById('mode-ico').textContent = m.ico;
  document.getElementById('mode-nm').textContent = m.nm;
  socket.emit('mode', { session_id:sessionId, mode:currentMode });
}
function setConn(on) {
  const dot = document.getElementById('conn-dot');
  dot.className = 'dot' + (on?' on':'');
  document.getElementById('conn-txt').textContent = on ? 'online' : '…';
}

// ═══ INIT ═══
const m = MODES[currentMode];
document.getElementById('mode-ico').textContent = m.ico;
document.getElementById('mode-nm').textContent = m.nm;
document.getElementById('input').addEventListener('keydown', (e) => { if (e.key==='Enter') sendInput(); });

// PWA
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
</script>
</body>
</html>
