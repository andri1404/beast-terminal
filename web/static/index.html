<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>BEAST — Agent Workspace</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230d1117'/%3E%3Ctext x='50%25' y='55%25' font-size='280' text-anchor='middle' dominant-baseline='middle'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2128;
  --border: #30363d;
  --border2: #21262d;
  --text: #e6edf3;
  --dim: #8b949e;
  --accent: #f778ba;      /* pink (Claude-ish) */
  --accent2: #d2a8ff;     /* purple */
  --green: #3fb950;
  --orange: #ff7b72;
  --cyan: #79c0ff;
  --yellow: #d29922;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }

/* ═══ APP SHELL ═══ */
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; }

/* ═══ HEADER ═══ */
#header {
  display:flex; align-items:center; gap:12px;
  padding:10px 16px;
  background: var(--bg2);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  min-height:52px;
}
#logo { display:flex; align-items:center; gap:10px; }
#logo .lg { font-size:18px; font-weight:800; letter-spacing:-0.5px; }
#logo .lg .a { color: var(--accent); }
#logo .lg .b { color: var(--text); }
#logo .ver { font-size:10px; color: var(--dim); background:var(--bg3); padding:2px 6px; border-radius:10px; }
#conn { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
#conn .dot { width:8px; height:8px; border-radius:50%; background:var(--yellow); }
#conn .dot.on { background: var(--green); box-shadow:0 0 6px var(--green); }
#spacer { flex:1; }
#model-badge {
  display:flex; align-items:center; gap:6px;
  font-size:11px; color:var(--text);
  background:var(--bg3); border:1px solid var(--border);
  padding:5px 10px; border-radius:6px; cursor:pointer;
}
#model-badge:hover { border-color:var(--accent); }
#hdr-actions { display:flex; gap:6px; }
.icon-btn {
  background:var(--bg3); border:1px solid var(--border); color:var(--text);
  padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px;
  white-space:nowrap;
}
.icon-btn:hover { border-color:var(--accent); color:var(--accent); }

/* ═══ MAIN AREA (sidebar + terminal) ═══ */
#main { display:flex; flex:1; min-height:0; }

/* ═══ SIDEBAR (sessions) ═══ */
#sidebar {
  width:220px; background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0;
}
#sidebar-head {
  padding:12px 14px 8px; font-size:11px; font-weight:700;
  color:var(--dim); text-transform:uppercase; letter-spacing:0.5px;
  display:flex; justify-content:space-between; align-items:center;
}
#sidebar-head .add {
  background:var(--bg3); border:1px solid var(--border); color:var(--text);
  width:24px; height:24px; border-radius:5px; cursor:pointer; font-size:15px;
}
#sidebar-head .add:hover { border-color:var(--accent); color:var(--accent); }
#sessions { flex:1; overflow-y:auto; padding:4px 8px; }
.session {
  display:flex; align-items:center; gap:8px;
  padding:9px 10px; margin:2px 0; border-radius:6px; cursor:pointer;
  font-size:12px; color:var(--dim); border:1px solid transparent;
}
.session:hover { background:var(--bg3); }
.session.active { background:var(--bg3); border-color:var(--border); color:var(--text); }
.session .s-dot { width:7px; height:7px; border-radius:50%; background:var(--yellow); flex-shrink:0; }
.session .s-dot.busy { background:var(--orange); animation:pulse 1s infinite; }
.session .s-dot.idle { background:var(--green); }
.session .s-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:'SF Mono',Consolas,monospace; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }

/* ═══ TERMINAL PANEL ═══ */
#term-panel { flex:1; display:flex; flex-direction:column; min-width:0; }
#tabs { display:flex; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; flex-shrink:0; }
.tab {
  display:flex; align-items:center; gap:6px; padding:8px 14px;
  font-size:12px; color:var(--dim); border-right:1px solid var(--border2);
  cursor:pointer; white-space:nowrap;
}
.tab.active { color:var(--text); background:var(--bg); border-top:2px solid var(--accent); }
.tab .t-close { color:var(--dim); font-size:14px; }
.tab .t-close:hover { color:var(--orange); }
#tab-add { padding:8px 12px; color:var(--dim); cursor:pointer; }
#tab-add:hover { color:var(--accent); }

#term-wrap { flex:1; position:relative; min-height:0; }
#terminal { position:absolute; inset:0; padding:8px; }
#md-view { position:absolute; inset:0; padding:16px 20px; overflow-y:auto; display:none; background:var(--bg); }
#md-view pre { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:12px; overflow-x:auto; }
#md-view code { font-family:'SF Mono',Consolas,monospace; font-size:12px; color:var(--cyan); }
#md-view h1,#md-view h2,#md-view h3 { margin:14px 0 6px; }
#md-view p { margin:6px 0; line-height:1.5; }
#md-view ul,#md-view ol { margin:6px 0 6px 20px; }
#md-view table { border-collapse:collapse; width:100%; margin:10px 0; }
#md-view th,#md-view td { border:1px solid var(--border); padding:6px 10px; text-align:left; font-size:12px; }
#md-view th { background:var(--bg3); }
#md-view a { color:var(--cyan); }

/* ═══ VIEW TOGGLE ═══ */
#view-toggle { display:flex; gap:4px; background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:2px; }
#view-toggle button { background:transparent; border:none; color:var(--dim); padding:4px 10px; border-radius:4px; cursor:pointer; font-size:11px; }
#view-toggle button.active { background:var(--bg); color:var(--text); }

/* ═══ STATUS BAR ═══ */
#statusbar {
  display:flex; align-items:center; gap:14px;
  padding:6px 14px; font-size:11px; color:var(--dim);
  background:var(--bg2); border-top:1px solid var(--border);
  flex-shrink:0; overflow-x:auto; white-space:nowrap;
}
#statusbar .s-model { color:var(--accent2); font-weight:600; }
#statusbar .s-tok { color:var(--green); }
#statusbar .s-cost { color:var(--yellow); }
#statusbar .spacer { flex:1; }

/* ═══ CONNECTING ═══ */
#connecting {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:var(--bg3); border:1px solid var(--border); border-radius:10px;
  padding:24px 30px; z-index:200; text-align:center;
}
#connecting .spin {
  width:28px; height:28px; border:3px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; margin:0 auto 12px;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
#connecting p { font-size:13px; color:var(--dim); }

/* ═══ MOBILE KEY BAR ═══ */
#keybar {
  display: none;
  background: var(--bg2); border-top: 1px solid var(--border);
  padding: 6px 8px; gap: 5px; flex-wrap: wrap;
  flex-shrink: 0; justify-content: center;
}
#keybar button {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 10px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  font-family: 'SF Mono', Consolas, monospace; min-width: 38px; text-align: center;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#keybar button:active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
#keybar button.k-wide { min-width: 52px; }
#keybar button.k-enter { background: #f778ba22; color: var(--accent); border-color: #f778ba44; font-weight: 700; }
#keybar button.k-danger { color: var(--orange); }
#keybar .k-spacer { flex: 1; }

/* ═══ RESPONSIVE ═══ */
@media (max-width:768px) {
  #sidebar { display:none; }
  #model-badge span.m { display:none; }
  #keybar { display: flex; }
}
@media (max-width:480px) {
  #hdr-actions .icon-btn { display:none; }
  #tabs { font-size:11px; }
  #statusbar { gap: 8px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div id="logo">
      <span class="lg"><span class="a">🔥</span> BEAST<span class="b"> Terminal</span></span>
      <span class="ver">v5.5</span>
    </div>
    <div id="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">connecting…</span></div>
    <div id="spacer"></div>
    <div id="model-badge" onclick="switchMode(currentMode)" title="Click to switch mode">
      <span id="mode-emoji">🔥</span><span class="m" id="model-name">Pentest</span>
    </div>
    <div id="hdr-actions">
      <button class="icon-btn" onclick="toggleView()" title="Toggle terminal/markdown">📝 Markdown</button>
      <button class="icon-btn" onclick="newSession()" title="New session">+ New</button>
      <button class="icon-btn" onclick="killSession()" title="Kill current session">⏹</button>
      <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="sidebar-head">
        <span>AGENT SESSIONS</span>
        <button class="add" onclick="newSession()">+</button>
      </div>
      <div id="sessions"></div>
    </div>

    <!-- TERMINAL PANEL -->
    <div id="term-panel">
      <div id="tabs">
        <div class="tab active" id="tab-main"><span id="tab-name">terminal</span><span class="t-close" onclick="killSession()">×</span></div>
        <span id="tab-add" onclick="newSession()">+</span>
        <div style="flex:1"></div>
        <div id="view-toggle">
          <button id="vt-term" class="active" onclick="setView('term')">&gt;_ Terminal</button>
          <button id="vt-md" onclick="setView('md')">Markdown</button>
        </div>
      </div>
      <div id="term-wrap">
        <div id="terminal"></div>
        <div id="md-view"></div>
      </div>
    </div>
  </div>

  <!-- STATUS BAR -->
  <div id="statusbar">
    <span class="s-model" id="sb-model">—</span>
    <span>│</span>
    <span id="sb-mode">mode: —</span>
    <span>│</span>
    <span class="s-tok" id="sb-tokens">0 tok</span>
    <span class="s-cost" id="sb-cost">$0.0000</span>
    <span class="spacer"></span>
    <span id="sb-time">0m 0s</span>
    <span>│</span>
    <span id="sb-session">—</span>
  </div>

  <!-- MOBILE KEY BAR -->
  <div id="keybar">
    <button onclick="sendKey('Tab')">Tab</button>
    <button onclick="sendKey('Escape')">Esc</button>
    <button onclick="sendKey('CtrlC')" class="k-danger">^C</button>
    <button onclick="sendKey('CtrlD')" class="k-danger">^D</button>
    <button onclick="sendKey('/')">/</button>
    <button onclick="sendKey('ArrowUp')">↑</button>
    <button onclick="sendKey('ArrowDown')">↓</button>
    <button onclick="sendKey('ArrowLeft')">←</button>
    <button onclick="sendKey('ArrowRight')">→</button>
    <button onclick="sendKey(' ')">␣</button>
    <button onclick="sendKey('Enter')" class="k-enter k-wide">⏎ Run</button>
  </div>
</div>

<div id="connecting">
  <div class="spin"></div>
  <p>Connecting to BEAST…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.4/dist/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
// ═══ STATE ═══
let currentMode = localStorage.getItem('beast_mode') || 'pentest';
let sessionId = localStorage.getItem('beast_session') || '';
let currentView = 'term';
let sessionStart = Date.now();

const MODES = {
  pentest: { emoji:'🔥', name:'Pentest', color:'#ff7b72' },
  coding:  { emoji:'💻', name:'Coding', color:'#79c0ff' },
  general: { emoji:'🧠', name:'General', color:'#d2a8ff' },
};

// ═══ TERMINAL ═══
const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 768;
const fs = innerWidth < 480 ? 10 : innerWidth < 768 ? 11 : 13;

const term = new Terminal({
  cursorBlink: true, fontSize: fs,
  fontFamily: "'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace",
  theme: {
    background: '#0d1117', foreground: '#e6edf3',
    cursor: '#f778ba', cursorAccent: '#0d1117',
    selectionBackground: '#f778ba33',
    black:'#161b22', red:'#ff7b72', green:'#3fb950', yellow:'#d29922',
    blue:'#79c0ff', magenta:'#d2a8ff', cyan:'#79c0ff', white:'#e6edf3',
    brightBlack:'#8b949e', brightRed:'#ffa198', brightGreen:'#56d364',
    brightYellow:'#e3b341', brightBlue:'#a5d6ff', brightMagenta:'#e1b3ff',
    brightCyan:'#a5d6ff', brightWhite:'#ffffff',
  },
  allowProposedApi:true, scrollback:10000,
});

const fitAddon = new FitAddon.FitAddon();
const webLinks = new WebLinksAddon.WebLinksAddon();
term.loadAddon(fitAddon); term.loadAddon(webLinks);
term.open(document.getElementById('terminal'));
fitAddon.fit();
window.addEventListener('resize', () => fitAddon.fit());

// ═══ SOCKET ═══
const socket = io({
  query: { session_id: sessionId, mode: currentMode },
  transports: ['websocket','polling'],
  reconnection:true, reconnectionDelay:1000, reconnectionAttempts:Infinity,
});

socket.on('connect', () => {
  document.getElementById('connecting').style.display = 'none';
  setConn(true);
});

socket.on('connected', (d) => {
  sessionId = d.session_id;
  localStorage.setItem('beast_session', sessionId);
  document.getElementById('sb-session').textContent = d.session_name;
  document.getElementById('tab-name').textContent = d.session_name;
  updateSessions();
});

socket.on('output', (d) => {
  if (d.data) {
    term.clear();
    term.write(d.data.replace(/\n/g,'\r\n'));
    // Extract markdown from last AI response for md view
    renderMd(d.data);
  }
});

socket.on('error', (d) => {
  term.write('\r\n\x1b[31m[ERROR] ' + d.message + '\x1b[0m\r\n');
});

socket.on('disconnect', () => {
  setConn(false);
  document.getElementById('connecting').style.display = 'block';
});

// ═══ INPUT ═══
term.onData((data) => socket.emit('input', { session_id: sessionId, text: data }));
term.onPaste = (text) => socket.emit('input', { session_id: sessionId, text: text });
document.getElementById('term-wrap').addEventListener('click', () => { if(currentView==='term') term.focus(); });

// ═══ HELPERS ═══
function setConn(on) {
  const dot = document.getElementById('conn-dot');
  dot.className = 'dot' + (on ? ' on' : '');
  document.getElementById('conn-txt').textContent = on ? 'connected' : 'reconnecting…';
}
function setView(v) {
  currentView = v;
  document.getElementById('terminal').style.display = v==='term' ? 'block' : 'none';
  document.getElementById('md-view').style.display = v==='md' ? 'block' : 'none';
  document.getElementById('vt-term').classList.toggle('active', v==='term');
  document.getElementById('vt-md').classList.toggle('active', v==='md');
  if (v==='term') fitAddon.fit();
}
function toggleView() { setView(currentView==='term' ? 'md' : 'term'); }

function renderMd(raw) {
  // Extract markdown content between response headers (rough heuristic)
  const md = document.getElementById('md-view');
  const clean = raw
    .replace(/\x1b\[[0-9;]*m/g, '')  // strip ANSI
    .replace(/^.*[│╭╰├─]/gm, '')       // strip box-drawing lines (rough)
    .trim();
  md.innerHTML = marked.parse(clean) || '<p style="color:#8b949e">No markdown output yet. Run a command.</p>';
}

function switchMode(mode) {
  // Cycle: pentest -> coding -> general -> pentest
  const order = ['pentest','coding','general'];
  if (!mode || !MODES[mode]) {
    const i = (order.indexOf(currentMode) + 1) % order.length;
    mode = order[i];
  }
  currentMode = mode;
  localStorage.setItem('beast_mode', mode);
  const m = MODES[mode];
  document.getElementById('mode-emoji').textContent = m.emoji;
  document.getElementById('model-name').textContent = m.name;
  document.getElementById('sb-mode').textContent = 'mode: ' + mode;
  term.options.cursor = m.color;
  socket.emit('mode', { session_id: sessionId, mode: mode });
}

function newSession() {
  localStorage.removeItem('beast_session');
  location.reload();
}
function killSession() {
  if (confirm('Terminate this agent session?')) {
    socket.emit('kill_session', { session_id: sessionId });
    localStorage.removeItem('beast_session');
    setTimeout(() => location.reload(), 800);
  }
}
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
function updateSessions() {
  const el = document.getElementById('sessions');
  if (sessionId) {
    el.innerHTML = `<div class="session active"><span class="s-dot busy"></span><span class="s-name">${sessionId}</span></div>`;
  }
}

// ═══ STATUS BAR TICKER ═══
setInterval(() => {
  const el = document.getElementById('sb-time');
  const s = Math.floor((Date.now() - sessionStart) / 1000);
  el.textContent = Math.floor(s/60) + 'm ' + (s%60) + 's';
}, 1000);

// ═══ MOBILE KEY INPUT ═══
const KEYMAP = {
  'Enter':'\r', 'Tab':'\t', 'Escape':'\x1b',
  'ArrowUp':'\x1b[A', 'ArrowDown':'\x1b[B',
  'ArrowLeft':'\x1b[D', 'ArrowRight':'\x1b[C',
  'CtrlC':'\x03', 'CtrlD':'\x04', ' ':' ',
};
function sendKey(key) {
  const mapped = KEYMAP[key] || key;
  socket.emit('input', { session_id: sessionId, text: mapped });
  term.focus();
}

// ═══ QUICK COMMAND INJECTION (mobile-friendly) ═══
function sendCmd(cmd) {
  socket.emit('input', { session_id: sessionId, text: cmd });
  term.focus();
}

// ═══ PWA REGISTRATION ═══
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  });
}

// ═══ INIT ═══
switchMode(currentMode);
</script>
</body>
</html>
